model:
  boosting_type: gbdt
  objective: regression
  metric: mae

  # Profil GPU stable
  device_type: gpu
  gpu_platform_id: 0
  gpu_device_id: 0

  # Paramètres safe (profil conservateur GPU)
  max_depth: -1
  num_leaves: 256        # conservateur mais suffisant
  min_data_in_leaf: 3000 # HAUSSE : régularisation forte pour finance
  min_sum_hessian_in_leaf: 1.0   # hessian plus fort = splits plus stables

  # Régularisation
  lambda_l1: 0.0
  lambda_l2: 12.0        # renforcée
  min_gain_to_split: 0.0

  # Bin + mémoire
  max_bin: 255           # 511 faisait trop gonfler la VRAM

  # Feature & bagging
  feature_fraction: 0.1  # BAISSE : diversité entre arbres, réduit l’overfit
  bagging_fraction: 0.7
  bagging_freq: 1

  # Learning rate + n_estimators
  learning_rate: 0.005   # BAISSE : LR lent = meilleure généralisation
  n_estimators: 10000    # HAUSSE : compense le LR bas

  # Bruit / logs
  verbosity: -1
