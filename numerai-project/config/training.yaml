general:
  row_limit: null          # null = utilise tout le dataset (gros, mais meilleur signal)
  n_folds: 5               # 5-fold = compromis perf/temps qui me va bien
  holdout_eras: 50         # validation "future" (dernières eras) pour métriques corr
  early_stopping_rounds: 200
  embargo_eras: 4            # gap de 4 eras entre train et val pour éviter la fuite temporelle
  shuffle: true            # je shuffle toujours les folds
  stratify: false          # pas utile ici, on est en regression Numerai

files:
  train: "data/numerai_training_data.parquet"
  tournament: "data/numerai_tournament_data.parquet"
  submission: "submission.csv"

seed: 42

models:
  lgb_ensemble_seeds: [42, 43, 44, 45, 46]
  include_ridge: false
  include_mlp: false
  aggregator: mean

# Multi-target ensemble: train a full ensemble per target, then blend all predictions.
# Set to null or empty list to disable (single-target mode, uses auto-detected target).
# Use "auto" to auto-detect all target columns from the dataset.
multi_target:
  targets: "auto"          # "auto" = detect all target_* columns; or explicit list
  max_targets: 20          # cap to avoid training hundreds of models
  seeds_per_target: 2      # en multi-target, 2 seeds suffisent (diversité vient des targets)
  blend: sharpe_weighted   # "mean" = equal weight, "sharpe_weighted" = weight by holdout Sharpe

prediction:
  rank: true
  rank_by_era: true
  # Feature neutralization: reduces exposure to individual features -> better Sharpe
  neutralize: true           # enable/disable neutralization
  neutralize_proportion: 0.5 # 0.0=no effect, 1.0=full neutralization. 0.5 is a good default.
