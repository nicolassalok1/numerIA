general:
  row_limit: null          # null = utilise tout le dataset (gros, mais meilleur signal)
  n_folds: 5               # 5-fold = compromis perf/temps qui me va bien
  holdout_eras: 50         # validation "future" (dernières eras) pour métriques corr
  early_stopping_rounds: 200
  shuffle: true            # je shuffle toujours les folds
  stratify: false          # pas utile ici, on est en regression Numerai

files:
  train: "data/numerai_training_data.parquet"
  tournament: "data/numerai_tournament_data.parquet"
  submission: "submission.csv"

seed: 42

models:
  lgb_ensemble_seeds: [42, 43, 44, 45, 46]
  include_ridge: false
  include_mlp: false
  aggregator: mean

prediction:
  rank: true
  rank_by_era: true
