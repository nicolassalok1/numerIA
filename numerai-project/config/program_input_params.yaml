model:
  metric: mae                  # je reste sur MAE pour suivre le run

  device_type: gpu             # je force le GPU
  gpu_device_id: 0             # 4060 = device 0

  # Arbre large mais bien régularisé
  num_leaves: 512              # large pour capturer du signal non-linéaire
  min_data_in_leaf: 3000       # HAUSSE FORTE : données financières bruitées, petites feuilles = bruit
  min_sum_hessian_in_leaf: 1.0 # plus strict pour éviter les splits faibles
  max_bin: 511                 # tolérable côté VRAM avec ce setup

  # Régul L2
  lambda_l2: 10.0              # L2 renforcée pour compenser num_leaves élevé

  # Sous-échantillonnage
  bagging_fraction: 0.7        # 0.8 surchauffait, 0.7 généralise mieux
  feature_fraction: 0.1        # BAISSE FORTE : 0.7 -> 0.1, force la diversité entre arbres
  bagging_freq: 1

  # Optimisation
  learning_rate: 0.005         # BAISSE : LR lent = meilleure généralisation
  n_estimators: 10000          # HAUSSE : compense le LR bas, early stopping coupe si nécessaire
